<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CalCOFI · fall 2026 · the warm water off Southern California</title>
<!-- the calcofi.io brand, v2: its own fonts.css, theme.css and font files, copied verbatim into page/brand/ (see
     brand/README.md) so the page needs nothing from calcofi.io when it starts. Dark, and not theme.js: the story is one
     fixed look for a video, it has no theme toggle and must not read a visitor's cookie. -->
<link rel="stylesheet" href="./brand/fonts.css">
<link rel="stylesheet" href="./brand/theme.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="stage">
  <div id="map"></div>
  <div id="scrim-top"></div>
  <div id="scrim-strip"></div>
  <div id="scrim-left"></div>

  <div id="head"><span id="head-a"></span><span id="head-b"></span></div>
  <div id="row">
    <div id="year"></div>
    <div id="words">
      <div id="line1">
        <div id="caption"></div>
        <div id="pill">preliminary data</div>
      </div>
      <div id="event"></div>
    </div>
  </div>

  <div id="legends">
    <div class="legend" id="legend-temp">
      <div class="legend-title">Temperature</div>
      <div class="legend-bar"></div>
    </div>
    <div class="legend" id="legend-anom">
      <div class="legend-title">Change from baseline</div>
      <div class="legend-bar"></div>
    </div>
  </div>

  <svg id="leader" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
  <div id="tag"></div>

  <!-- the 35 s cut's first page: the program and its partners (Rasmus Swalethorp 2026-11-18: "flashing the logos on the
       first page of the video"). Logos from calcofi.io (brand/v2, images/partners), copied into logos/ -->
  <div id="partners">
    <img class="calcofi" src="./logos/logo_calcofi_h.svg" alt="CalCOFI">
    <div class="seals">
      <figure class="sio"><img src="./logos/ucsd-sio_vertical_white.png" alt="UC San Diego Scripps Institution of Oceanography"></figure>
      <figure><img src="./logos/noaa.png" alt=""><figcaption>NOAA Fisheries<br>Southwest Fisheries<br>Science Center</figcaption></figure>
    </div>
  </div>

  <svg id="strip" width="1080" height="262" viewBox="0 0 1080 262"></svg>
  <div id="credit"></div>
  <div id="loading">loading …</div>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
