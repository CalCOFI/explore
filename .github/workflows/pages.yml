# build the explorer and publish it to GitHub Pages (calcofi.io/explore/). the data objects are not in the
# repo: VITE_DATA_URL points the app at GCS (the Phase-0 spike cut for now; the release catalog in Phase 1).
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
        env:
          VITE_DATA_URL: https://storage.googleapis.com/calcofi-db/explore-spike/data/
          VITE_BASE: /explore/
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
