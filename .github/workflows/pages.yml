# build the explorer and publish it to GitHub Pages (calcofi.io/explore/). the data objects are not in the
# repo: VITE_DATA_URL points the app at GCS (the Phase-0 spike cut for now; the release catalog in Phase 1).
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
        env:
          # the bucket root the catalog's object paths hang off, and the releases prefix under it.
          # the real release since v2026.09.04 (2026-09-04), the first to ship the browser-shaped
          # objects (obs_bio, obs_env, sample_root, sample_spatial, climatology); before that the
          # site read the explore-dev cut of v2026.08.25 (explore-dev-root/ + explore-dev/releases).
          VITE_DATA_URL: https://storage.googleapis.com/calcofi-db/
          VITE_RELEASE_PREFIX: ducklake/releases
          VITE_BASE: /explore/
          # the brand the deployed app wears. The code's default is v3 (the brand's header: the same words on every
          # product, the menu button, the wave), which loads calcofi.io/brand/v3/ — and that folder is published by
          # CalCOFI.github.io, so it has to be LIVE there first. Until the repository variable VITE_BRAND says v3,
          # the deploy stays on v2, which is what is live today. Order: merge and deploy the site, check that
          # https://calcofi.io/brand/v3/nav.json answers, then set the variable to v3 and re-run this workflow.
          VITE_BRAND: ${{ vars.VITE_BRAND || 'v2' }}
          # the feedback endpoint (calcofi4r::cc_feedback_script() deployed as a web app): a repository variable, so
          # setting it needs no code change; empty = the dialog offers the prefilled GitHub issue only
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
          # the Query Builder's own address, once it has one (https://calcofi.io/query/, deployed by CalCOFI/query from this
          # repo's src/builder). Set, every Explorer link to the Query Builder goes there and builder.html becomes a
          # redirect to it that carries the link's picks; empty = builder.html is the app, as before. Set it only AFTER
          # https://calcofi.io/query/ answers with the Query Builder (README § The Query Builder's own address).
          VITE_QUERY_URL: ${{ vars.VITE_QUERY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
